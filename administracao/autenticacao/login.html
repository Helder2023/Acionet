<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acionet Control Center | Login</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* ============================================
           FUNDO FUTURISTA COM ANIMAÇÃO
           ============================================ */
        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }
        
        /* Imagem de fundo com overlay */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4) contrast(1.2);
        }
        
        /* Gradiente futurista sobreposto */
        .bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.85) 0%,
                rgba(0, 20, 40, 0.7) 50%,
                rgba(0, 0, 0, 0.85) 100%);
            z-index: -1;
        }
        
        /* Partículas animadas */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.8), rgba(0, 212, 255, 0));
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Linhas de grade futurista */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }
        
        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }
        
        /* Círculos neon orbitais */
        .orbital-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotateRing 30s linear infinite;
        }
        
        .orbital-ring::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #00D4FF;
            border-radius: 50%;
            box-shadow: 0 0 20px #00D4FF;
            transform: translateX(-50%);
        }
        
        .orbital-ring:nth-child(2) {
            width: 800px;
            height: 800px;
            animation-direction: reverse;
            animation-duration: 40s;
            border-color: rgba(168, 85, 247, 0.1);
        }
        
        .orbital-ring:nth-child(2)::before {
            background: #A855F7;
            box-shadow: 0 0 20px #A855F7;
        }
        
        @keyframes rotateRing {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
        
        /* ============================================
           CONTAINER PRINCIPAL
           ============================================ */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Card de Login - ALTURA REDUZIDA */
        .login-card {
            background: rgba(10, 12, 21, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 32px 36px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 212, 255, 0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .login-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 212, 255, 0.1);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Logo - REDUZIDO */
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #00D4FF, #A855F7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
        }
        
        .logo-icon i {
            font-size: 28px;
            color: white;
        }
        
        .login-logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #00D4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        
        .login-logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-top: 4px;
        }
        
        /* Título - REDUZIDO */
        .login-title {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .login-title h2 {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .login-title span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }
        
        /* Formulário - ESPAÇAMENTO REDUZIDO */
        .login-form {
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        
        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .input-field {
            position: relative;
        }
        
        .input-field i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 212, 255, 0.6);
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-field input {
            width: 100%;
            padding: 11px 14px 11px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .input-field input:focus {
            outline: none;
            border-color: #00D4FF;
            background: rgba(0, 212, 255, 0.05);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }
        
        .input-field input:focus + i {
            color: #00D4FF;
        }
        
        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* Opções adicionais - REDUZIDO */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        
        .checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        
        .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #00D4FF;
        }
        
        .checkbox span {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        
        .forgot-link {
            color: #00D4FF;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }
        
        .forgot-link:hover {
            color: #A855F7;
            text-decoration: underline;
        }
        
        /* Botão de Login - REDUZIDO */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00D4FF, #0099cc);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(0, 212, 255, 0.4);
        }
        
        .login-btn:hover::before {
            left: 100%;
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        /* Separador - REDUZIDO */
        .login-divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
        }
        
        .login-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }
        
        .login-divider span {
            background: rgba(10, 12, 21, 0.9);
            padding: 0 14px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            position: relative;
            backdrop-filter: blur(10px);
        }
        
        /* Login Social - REDUZIDO */
        .social-login {
            display: flex;
            gap: 14px;
            justify-content: center;
        }
        
        .social-btn {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }
        
        .social-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00D4FF;
            color: #00D4FF;
            transform: translateY(-2px);
        }
        
        /* Cadastro - REDUZIDO */
        .signup-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .signup-link p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }
        
        .signup-link a {
            color: #00D4FF;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .signup-link a:hover {
            color: #A855F7;
        }
        
        /* Mensagem de erro - REDUZIDO */
        .error-message {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 8px;
            color: #FF3366;
            font-size: 12px;
        }
        
        .error-message.show {
            display: flex;
        }
        
        /* Status de carregamento */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsividade */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px 20px;
            }
            
            .login-logo h1 {
                font-size: 20px;
            }
            
            .login-title h2 {
                font-size: 18px;
            }
            
            .orbital-ring {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Fundo Futurista -->
    <div class="login-background">
        <!-- Imagem de fundo futurista -->
        <img class="bg-image" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop" alt="Fundo Futurista">
        
        <!-- Gradiente -->
        <div class="bg-gradient"></div>
        
        <!-- Partículas Animadas -->
        <div class="particles" id="particles"></div>
        
        <!-- Linhas de Grade -->
        <div class="grid-lines"></div>
        
        <!-- Anéis Orbitais -->
        <div class="orbital-ring"></div>
        <div class="orbital-ring"></div>
    </div>
    
    <!-- Container de Login -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1>ACIONET</h1>
                <p>Control Center v2.0</p>
            </div>
            
            <!-- Título -->
            <div class="login-title">
                <h2>Bem-vindo</h2>
                <span>Faça login para acessar</span>
            </div>
            
            <!-- Mensagem de erro -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText">Credenciais inválidas. Tente novamente.</span>
            </div>
            
            <!-- Formulário -->
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label>E-mail</label>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@acionet.com" value="admin@acionet.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Senha</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" value="admin123" required>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>Lembrar</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotPassword">Esqueceu?</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Entrar
                </button>
            </form>
            
            <!-- Separador -->
            <div class="login-divider">
                <span>ou</span>
            </div>
            
            <!-- Social Login -->
            <div class="social-login">
                <div class="social-btn" data-provider="google">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-btn" data-provider="github">
                    <i class="fab fa-github"></i>
                </div>
                <div class="social-btn" data-provider="microsoft">
                    <i class="fab fa-microsoft"></i>
                </div>
            </div>
            
            <!-- Link Cadastro -->
            <div class="signup-link">
                <p>Novo aqui? <a href="#" id="signupLink">Criar conta</a></p>
            </div>
        </div>
    </div>
    
    <script>
        // ============================================
        // PARTÍCULAS ANIMADAS
        // ============================================
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 3 + 1;
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 15;
                const startX = Math.random() * window.innerWidth;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = startX + 'px';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                
                container.appendChild(particle);
            }
        }
        
        // ============================================
        // LOGIN VALIDATION
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('rememberMe');
        
        // Credenciais válidas
        const validCredentials = [
            { email: 'admin@acionet.com', password: 'admin123' },
            { email: 'user@acionet.com', password: 'user123' }
        ];
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }
        
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.innerHTML = 'Entrando <span class="loading"></span>';
                loginBtn.disabled = true;
            } else {
                loginBtn.innerHTML = 'Entrar';
                loginBtn.disabled = false;
            }
        }
        
        function validateCredentials(email, password) {
            return validCredentials.some(cred => 
                cred.email === email && cred.password === password
            );
        }
        
        function saveSession(email, remember) {
            if (remember) {
                localStorage.setItem('userSession', JSON.stringify({
                    email: email,
                    loggedIn: true,
                    timestamp: new Date().getTime()
                }));
            }
            sessionStorage.setItem('currentUser', email);
        }
        
        function checkSavedSession() {
            const savedSession = localStorage.getItem('userSession');
            if (savedSession) {
                const session = JSON.parse(savedSession);
                const oneDay = 24 * 60 * 60 * 1000;
                if (session.loggedIn && (new Date().getTime() - session.timestamp) < oneDay) {
                    emailInput.value = session.email;
                    rememberMe.checked = true;
                }
            }
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = rememberMe.checked;
            
            if (!email || !password) {
                showError('Preencha todos os campos.');
                return;
            }
            
            setLoading(true);
            
            setTimeout(() => {
                if (validateCredentials(email, password)) {
                    saveSession(email, remember);
                    
                    // Toast de sucesso
                    const toast = document.createElement('div');
                    toast.style.cssText = `
                        position: fixed;
                        bottom: 30px;
                        right: 30px;
                        background: rgba(0, 255, 170, 0.9);
                        backdrop-filter: blur(10px);
                        padding: 10px 18px;
                        border-radius: 12px;
                        color: #0A0C15;
                        font-weight: 600;
                        font-size: 13px;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        z-index: 1000;
                        animation: slideInRight 0.3s ease;
                        font-family: 'Inter', sans-serif;
                    `;
                    toast.innerHTML = '<i class="fas fa-check-circle"></i> Login realizado! Redirecionando...';
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    setLoading(false);
                    showError('E-mail ou senha inválidos.');
                }
            }, 1000);
        }
        
        function handleSocialLogin(provider) {
            showError(`Login com ${provider} em desenvolvimento. Use o formulário padrão.`);
        }
        
        function handleForgotPassword() {
            const email = prompt('Digite seu e-mail para recuperar a senha:');
            if (email && email.includes('@')) {
                alert(`Instruções de recuperação enviadas para ${email}`);
            } else if (email) {
                alert('Digite um e-mail válido');
            }
        }
        
        function handleSignup() {
            alert('🔧 Cadastro em desenvolvimento.\n\nUse: admin@acionet.com / admin123');
        }
        
        // ============================================
        // EVENT LISTENERS
        // ============================================
        loginForm.addEventListener('submit', handleLogin);
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            handleForgotPassword();
        });
        document.getElementById('signupLink').addEventListener('click', (e) => {
            e.preventDefault();
            handleSignup();
        });
        
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const provider = btn.getAttribute('data-provider');
                handleSocialLogin(provider);
            });
        });
        
        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            checkSavedSession();
        });
        
        window.addEventListener('resize', () => {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            createParticles();
        });
        
        // CSS para animação do toast
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
